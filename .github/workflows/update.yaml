name: 更新每月论文workFlow

on:
  schedule:
    - cron: '0 16 1 * *'  # 每月1日 UTC 16:00 (+8即为北京时间 00:00)
  workflow_dispatch:    # 允许手动触发
  push:                # 在推送时触发
    branches:
      - main        # 只在推送到 main 分支时触发

permissions:
  contents: write
  issues: write

env:
  BIN_PATH: target/release/my_auto_papers.exe

jobs:
  update_monthly_papers:
    runs-on: windows-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 设置 Rust 环境
      uses: dtolnay/rust-toolchain@stable

    - name: 缓存 Cargo 依赖
      uses: actions/cache@v5
      id: cargo-cache
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          target/release/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: 安装并缓存 Just
      uses: actions/cache@v5
      id: just-cache
      with:
        path: |
          C:\Users\runneradmin\.cargo\bin\just.exe
          C:\Users\runneradmin\.cargo\.package-cache
        key: ${{ runner.os }}-just-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-just-

    - name: 安装 Just 工具
      if: steps.just-cache.outputs.cache-hit != 'true'
      run: |
        cargo install just --force
        echo "C:\Users\runneradmin\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: 检查缓存的可执行文件
      id: check-bin
      shell: pwsh
      run: |
        $exists = Test-Path -Path "${{ env.BIN_PATH }}"
        Write-Output "exists_bin=$exists" >> $env:GITHUB_OUTPUT
        Write-Host "Executable exists: $exists"

    - name: 若无缓存，则构建Release版本
      if: steps.cargo-cache.outputs.cache-hit != 'true' || steps.check-bin.outputs.exists_bin != 'true'
      run: cargo build --release

    - name: 运行每月更新
      run: just run "${{ env.BIN_PATH }}"

    - name: 提交更改
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: '✏️自动更新论文'
        file_pattern: 'README.md .github/ISSUE_TEMPLATE.md'
        push_options: '--force'

    # JasonEtco/create-an-issue 仍停在 Node 20 且不再维护；改用 gh 解析 front matter 创建/更新 Issue
    - name: 创建 Issue 通知
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        from pathlib import Path

        text = Path(".github/ISSUE_TEMPLATE.md").read_text(encoding="utf-8")
        if not text.startswith("---"):
            raise SystemExit("ISSUE_TEMPLATE.md missing front matter")

        _, front, body = text.split("---", 2)
        title = ""
        labels = []
        for line in front.splitlines():
            line = line.strip()
            if line.startswith("title:"):
                title = line[len("title:"):].strip()
            elif line.startswith("labels:"):
                labels = [x.strip() for x in line[len("labels:"):].split(",") if x.strip()]

        if not title:
            raise SystemExit("ISSUE_TEMPLATE.md missing title")

        Path(".github/_issue_body.md").write_text(body.lstrip("\n"), encoding="utf-8")
        Path(".github/_issue_meta.txt").write_text(
            title + "\n" + "\n".join(labels), encoding="utf-8"
        )
        PY

        TITLE=$(sed -n '1p' .github/_issue_meta.txt)
        mapfile -t LABELS < <(tail -n +2 .github/_issue_meta.txt)

        EXISTING=$(gh issue list --state open --limit 50 --json number,title \
          --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

        if [ -n "$EXISTING" ]; then
          echo "Updating existing issue #$EXISTING"
          gh issue edit "$EXISTING" --body-file .github/_issue_body.md
        else
          echo "Creating new issue: $TITLE"
          LABEL_ARGS=()
          for label in "${LABELS[@]}"; do
            [ -n "$label" ] && LABEL_ARGS+=(--label "$label")
          done
          gh issue create --title "$TITLE" --body-file .github/_issue_body.md "${LABEL_ARGS[@]}"
        fi

        rm -f .github/_issue_body.md .github/_issue_meta.txt
